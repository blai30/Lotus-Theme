# Publishes the plugin to JetBrains Marketplace when a draft release created by build.yml is published.
# Secrets: PUBLISH_TOKEN (required); CERTIFICATE_CHAIN, PRIVATE_KEY, PRIVATE_KEY_PASSWORD (optional, enable signing).

name: Release

on:
  release:
    types: [ prereleased, released ]

jobs:

  release:
    name: Publish plugin
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      TAG_NAME: ${{ github.event.release.tag_name }}
    steps:
      - name: Fetch sources
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      # Moves the Unreleased section under the released version, using the (possibly edited) release notes.
      - name: Patch changelog
        if: ${{ github.event.release.body != '' }}
        env:
          CHANGELOG: ${{ github.event.release.body }}
        run: |
          RELEASE_NOTE="./build/tmp/release_note.txt"
          mkdir -p "$(dirname "$RELEASE_NOTE")"
          echo "$CHANGELOG" > "$RELEASE_NOTE"

          ./gradlew patchChangelog --release-note-file="$RELEASE_NOTE"

      - name: Publish plugin
        env:
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
        run: ./gradlew publishPlugin

      - name: Upload release asset
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$TAG_NAME" ./build/distributions/*

      - name: Create changelog pull request
        if: ${{ github.event.release.body != '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="changelog-update-$TAG_NAME"
          LABEL="release changelog"

          git config user.email "action@github.com"
          git config user.name "GitHub Action"

          git checkout -b "$BRANCH"
          git commit -am "Changelog update - $TAG_NAME"
          git push --set-upstream origin "$BRANCH"

          gh label create "$LABEL" \
            --description "Pull requests with release changelog update" \
            --force \
            || true

          gh pr create \
            --title "Changelog update - \`$TAG_NAME\`" \
            --body "Patched \`CHANGELOG.md\` for the \`$TAG_NAME\` release." \
            --label "$LABEL" \
            --base main \
            --head "$BRANCH"
